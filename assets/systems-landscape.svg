<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="405" viewBox="0 0 1200 405" role="img" aria-labelledby="title desc">
  <title id="title">Systems landscape</title>
  <desc id="desc">Four featured systems connected to a shared core of provenance, verification, portability, and explicit limits.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d17"/>
      <stop offset="1" stop-color="#111528"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2a3d"/>
      <stop offset=".55" stop-color="#111f3e"/>
      <stop offset="1" stop-color="#221a3c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="405" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="403" rx="23" fill="none" stroke="#64748b" stroke-opacity=".22"/>
  <text x="48" y="47" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="1.7">SYSTEMS LANDSCAPE</text>
  <text x="48" y="72" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5">Different products; the same underlying discipline: inspectability before confidence.</text>

  <g stroke="#334155" stroke-width="1.8" fill="none">
    <path d="M430 206H342C300 206 286 170 286 146"/>
    <path d="M770 206H858C900 206 914 170 914 146"/>
    <path d="M430 226H342C300 226 286 258 286 282"/>
    <path d="M770 226H858C900 226 914 258 914 282"/>
  </g>
  <g stroke-width="2.4" fill="none">
    <path d="M430 206H371" stroke="#22d3ee" stroke-opacity=".72"/>
    <path d="M770 206H829" stroke="#3b82f6" stroke-opacity=".72"/>
    <path d="M430 226H371" stroke="#8b5cf6" stroke-opacity=".72"/>
    <path d="M770 226H829" stroke="#22d3ee" stroke-opacity=".72"/>
  </g>

  <g transform="translate(430,126)">
    <rect width="340" height="178" rx="26" fill="url(#core)" stroke="#60a5fa" stroke-opacity=".34"/>
    <text x="170" y="42" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.7">SHARED ENGINEERING CORE</text>
    <line x1="34" y1="58" x2="306" y2="58" stroke="#475569" stroke-opacity=".65"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">
      <rect x="34" y="82" width="126" height="31" rx="9" fill="#082d3a" stroke="#22d3ee" stroke-opacity=".28"/>
      <text x="97" y="102" text-anchor="middle" fill="#a5f3fc">PROVENANCE</text>
      <rect x="180" y="82" width="126" height="31" rx="9" fill="#0d2343" stroke="#3b82f6" stroke-opacity=".28"/>
      <text x="243" y="102" text-anchor="middle" fill="#bfdbfe">VERIFICATION</text>
      <rect x="34" y="128" width="126" height="31" rx="9" fill="#181b3e" stroke="#8b5cf6" stroke-opacity=".28"/>
      <text x="97" y="148" text-anchor="middle" fill="#ddd6fe">PORTABILITY</text>
      <rect x="180" y="128" width="126" height="31" rx="9" fill="#0b2938" stroke="#22d3ee" stroke-opacity=".28"/>
      <text x="243" y="148" text-anchor="middle" fill="#a5f3fc">EXPLICIT LIMITS</text>
    </g>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(48,103)">

      <rect x="18" y="18" width="52" height="24" rx="12" fill="#083344"/>
      <text x="44" y="34" text-anchor="middle" fill="#67e8f9" font-size="10" font-weight="800">ASB</text>
      <text x="18" y="66" fill="#e2e8f0" font-size="15" font-weight="800">Agent Session Bridge</text>
      <text x="18" y="88" fill="#64748b" font-size="11.5">agent trajectory interchange + fidelity</text>
    </g>

    <g transform="translate(858,103)">
      <rect width="294" height="104" rx="17" fill="#0d1930" stroke="#3b82f6" stroke-opacity=".25"/>
      <rect x="18" y="18" width="52" height="24" rx="12" fill="#10264a"/>
      <text x="44" y="34" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="800">VL</text>
      <text x="18" y="66" fill="#e2e8f0" font-size="15" font-weight="800">Validation Ledger</text>
      <text x="18" y="88" fill="#64748b" font-size="11.5">evidence → hypothesis → decision</text>
    </g>

    <g transform="translate(48,248)">
      <rect width="294" height="104" rx="17" fill="#12172f" stroke="#8b5cf6" stroke-opacity=".25"/>
      <rect x="18" y="18" width="52" height="24" rx="12" fill="#221b46"/>
      <text x="44" y="34" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="800">WS</text>
      <text x="18" y="66" fill="#e2e8f0" font-size="15" font-weight="800">WeaveStudio</text>
      <text x="18" y="88" fill="#64748b" font-size="11.5">visual workflows + claim provenance</text>
    </g>

    <g transform="translate(858,248)">
      <rect width="294" height="104" rx="17" fill="#0a1b2b" stroke="#22d3ee" stroke-opacity=".25"/>
      <rect x="18" y="18" width="52" height="24" rx="12" fill="#083344"/>
      <text x="44" y="34" text-anchor="middle" fill="#67e8f9" font-size="10" font-weight="800">BW</text>
      <text x="18" y="66" fill="#e2e8f0" font-size="15" font-weight="800">BuildWorld AI</text>
      <text x="18" y="88" fill="#64748b" font-size="11.5">deterministic graph simulation</text>

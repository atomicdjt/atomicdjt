        <ellipse cx="31" cy="29" rx="29" ry="11" transform="rotate(-28 31 29)" stroke-opacity=".8"/>
        <circle cx="31" cy="29" r="4" fill="#bd985f" stroke="none"/>
        <circle cx="51" cy="18" r="3" fill="#bd985f" stroke="none"/>
        <path d="M7 47L13 41M48 48L54 42M13 10L18 15" stroke-width="2.5"/>

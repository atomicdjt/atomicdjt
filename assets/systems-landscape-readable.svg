      <text x="105" y="37" fill="#26372f" font-size="28" font-weight="800">Cosmic Atlas Scientific · BuildWorld AI</text>
      <text x="105" y="66" fill="#59685e" font-size="22">Source-backed astronomy and explicitly heuristic simulations.</text>
    </g>

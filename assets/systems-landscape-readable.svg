        <path d="M5 10C18 10 20 46 34 46S50 10 56 10M5 28C18 28 20 10 34 10S50 46 56 46M5 46C18 46 20 10 34 10S50 28 56 28"/>
        <circle cx="5" cy="10" r="3" fill="#728b68"/>
        <circle cx="56" cy="46" r="3" fill="#728b68"/>
      </g>
      <text x="105" y="37" fill="#26372f" font-size="28" font-weight="800">WeaveStudio</text>
      <text x="105" y="66" fill="#59685e" font-size="22">Local-first workflows with lineage and human checkpoints.</text>
    </g>

    <g transform="translate(56,416)">

  <line x1="56" y1="528" x2="1144" y2="528" stroke="#778479" stroke-opacity=".32"/>
  <text x="56" y="550" fill="#526458" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" letter-spacing=".6">PROVENANCE · REPRODUCIBLE REVIEW · EXPLICIT LIMITS</text>

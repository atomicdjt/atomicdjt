<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="116" viewBox="0 0 1200 116" role="img" aria-labelledby="title desc">
  <title id="title">Evidence first, claims second</title>
  <desc id="desc">Closing banner for David Turner's GitHub profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset=".5" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#15142d"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="116" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="114" rx="21" fill="none" stroke="#64748b" stroke-opacity=".20"/>
  <rect x="52" y="26" width="86" height="3" rx="1.5" fill="url(#line)"/>
  <text x="52" y="63" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="800">EVIDENCE FIRST. CLAIMS SECOND.</text>
  <text x="52" y="87" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">build → verify → review → narrow the claim</text>
  <text x="1148" y="67" text-anchor="end" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">atomicdjt</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Engineering evidence dashboard</title>
  <desc id="desc">A polished evidence dashboard highlighting upstream merges, algorithmic scaling, review-side verification, and featured systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d17"/>
      <stop offset="1" stop-color="#101527"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2031"/>
      <stop offset="1" stop-color="#0a1422"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c35"/>
      <stop offset="1" stop-color="#0a1423"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="330" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="328" rx="23" fill="none" stroke="#64748b" stroke-opacity=".24"/>
  <text x="48" y="46" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="1.7">SIGNAL, NOT VANITY METRICS</text>
  <text x="48" y="70" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5">Selected evidence that can be inspected in repositories and review threads.</text>
  <rect x="48" y="86" width="1104" height="2" rx="1" fill="url(#rule)" opacity=".72"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(48,111)">
      <rect width="258" height="166" rx="18" fill="url(#cardA)" stroke="#22d3ee" stroke-opacity=".28"/>
      <circle cx="32" cy="31" r="13" fill="#083344"/>
      <path d="M26 31l4 4 8-9" fill="none" stroke="#67e8f9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="82" fill="#67e8f9" font-size="42" font-weight="850">5</text>
      <text x="24" y="108" fill="#e2e8f0" font-size="15.5" font-weight="800">MERGED UPSTREAM</text>
      <text x="24" y="132" fill="#94a3b8" font-size="12.5">Rosetta + super-productivity</text>
      <text x="24" y="151" fill="#64748b" font-size="11.5">maintainer-accepted changes</text>
    </g>

    <g transform="translate(330,111)">
      <rect width="258" height="166" rx="18" fill="url(#cardB)" stroke="#3b82f6" stroke-opacity=".30"/>
      <circle cx="32" cy="31" r="13" fill="#10264a"/>
      <path d="M24 35h16M28 29l4-4 4 4" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
      <text x="24" y="80" fill="#93c5fd" font-size="32" font-weight="850">O(n²) → O(n)</text>
      <text x="24" y="108" fill="#e2e8f0" font-size="15.5" font-weight="800">VERIFIED SCALING</text>
      <text x="24" y="132" fill="#94a3b8" font-size="12.5">security-critical hot path</text>
      <text x="24" y="151" fill="#64748b" font-size="11.5">reproduced during review</text>
    </g>

    <g transform="translate(612,111)">
      <rect width="258" height="166" rx="18" fill="url(#cardB)" stroke="#8b5cf6" stroke-opacity=".30"/>
      <circle cx="32" cy="31" r="13" fill="#221b46"/>
      <path d="M24 31h16M32 23v16" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/>
      <text x="24" y="79" fill="#c4b5fd" font-size="29" font-weight="850">5.5M + 1.6M+</text>
      <text x="24" y="108" fill="#e2e8f0" font-size="15.5" font-weight="800">REVIEW-SIDE CASES</text>
      <text x="24" y="132" fill="#94a3b8" font-size="12.5">equivalence + differential checks</text>
      <text x="24" y="151" fill="#64748b" font-size="11.5">before and after revisions</text>
    </g>

    <g transform="translate(894,111)">
      <rect width="258" height="166" rx="18" fill="url(#cardA)" stroke="#22d3ee" stroke-opacity=".28"/>
      <circle cx="32" cy="31" r="13" fill="#083344"/>
      <rect x="25" y="24" width="14" height="14" rx="3" fill="none" stroke="#67e8f9" stroke-width="2"/>
      <path d="M29 28h6M29 32h6" stroke="#67e8f9" stroke-width="1.5" stroke-linecap="round"/>
      <text x="24" y="82" fill="#67e8f9" font-size="42" font-weight="850">4</text>
      <text x="24" y="108" fill="#e2e8f0" font-size="15.5" font-weight="800">FEATURED SYSTEMS</text>
      <text x="24" y="132" fill="#94a3b8" font-size="12.5">source + tests + documentation</text>
      <text x="24" y="151" fill="#64748b" font-size="11.5">with explicit scope boundaries</text>
    </g>
  </g>

  <g transform="translate(48,298)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
    <text fill="#64748b">EVIDENCE PATH</text>
    <text x="112" fill="#a5f3fc">source</text>
    <text x="160" fill="#475569">→</text>
    <text x="184" fill="#bfdbfe">tests</text>
    <text x="224" fill="#475569">→</text>
    <text x="248" fill="#ddd6fe">review</text>
    <text x="298" fill="#475569">→</text>
    <text x="322" fill="#e2e8f0">bounded claim</text>
  </g>
</svg>
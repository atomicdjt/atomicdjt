<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc">
  <title id="title">Engineering evidence dashboard</title>
  <desc id="desc">Four evidence cards summarizing merged upstream work, a verified algorithmic improvement, review-side equivalence checks, and featured systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="290" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="288" rx="21" fill="none" stroke="#334155"/>
  <text x="52" y="52" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="2">ENGINEERING EVIDENCE</text>
  <rect x="52" y="66" width="1096" height="2" fill="url(#line)" opacity="0.7"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(52,94)">
      <rect width="250" height="150" rx="18" fill="#0c1b2e" stroke="#38bdf8" stroke-opacity="0.32"/>
      <text x="24" y="54" fill="#7dd3fc" font-size="38" font-weight="800">5</text>
      <text x="24" y="84" fill="#e2e8f0" font-size="16" font-weight="750">MERGED UPSTREAM PRs</text>
      <text x="24" y="111" fill="#94a3b8" font-size="13">Rosetta + super-productivity</text>
      <text x="24" y="131" fill="#64748b" font-size="12">external maintainer acceptance</text>
    </g>

    <g transform="translate(326,94)">
      <rect width="250" height="150" rx="18" fill="#0d1930" stroke="#60a5fa" stroke-opacity="0.32"/>
      <text x="24" y="54" fill="#93c5fd" font-size="34" font-weight="800">O(n²) → O(n)</text>
      <text x="24" y="84" fill="#e2e8f0" font-size="16" font-weight="750">HOT-PATH IMPROVEMENT</text>
      <text x="24" y="111" fill="#94a3b8" font-size="13">dangerous-command matcher</text>
      <text x="24" y="131" fill="#64748b" font-size="12">independently reproduced in review</text>
    </g>

    <g transform="translate(600,94)">
      <rect width="250" height="150" rx="18" fill="#11182f" stroke="#8b5cf6" stroke-opacity="0.32"/>
      <text x="24" y="54" fill="#c4b5fd" font-size="29" font-weight="800">5.5M + 1.6M+</text>
      <text x="24" y="84" fill="#e2e8f0" font-size="16" font-weight="750">REVIEW-SIDE CASES</text>
      <text x="24" y="111" fill="#94a3b8" font-size="13">equivalence + differential checks</text>
      <text x="24" y="131" fill="#64748b" font-size="12">before and after review changes</text>
    </g>

    <g transform="translate(874,94)">
      <rect width="274" height="150" rx="18" fill="#0d1b2c" stroke="#38bdf8" stroke-opacity="0.32"/>
      <text x="24" y="54" fill="#7dd3fc" font-size="38" font-weight="800">4</text>
      <text x="24" y="84" fill="#e2e8f0" font-size="16" font-weight="750">FEATURED SYSTEMS</text>
      <text x="24" y="111" fill="#94a3b8" font-size="13">source, docs, tests and demos</text>
      <text x="24" y="131" fill="#64748b" font-size="12">with explicit scope boundaries</text>
    </g>
  </g>
</svg>
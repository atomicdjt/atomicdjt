<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Verification-oriented engineering workflow</title>
  <desc id="desc">A six-stage pipeline from problem framing through evidence, emphasizing verification and external review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="250" rx="22" fill="url(#bg)"/>
  <text x="50" y="48" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="2">VERIFICATION-ORIENTED WORKFLOW</text>
  <text x="50" y="74" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">The artifact is not the proof. Each stage should leave inspectable evidence.</text>

  <line x1="100" y1="142" x2="1100" y2="142" stroke="url(#pipe)" stroke-width="4" stroke-linecap="round" opacity="0.72"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(110,142)">
      <circle r="22" fill="#0c2740" stroke="#38bdf8" stroke-width="2"/>
      <text y="5" text-anchor="middle" fill="#e0f2fe" font-size="14" font-weight="800">01</text>
      <text y="52" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="800">FRAME</text>
      <text y="72" text-anchor="middle" fill="#64748b" font-size="11">problem + limits</text>
    </g>
    <g transform="translate(306,142)">
      <circle r="22" fill="#0d2238" stroke="#38bdf8" stroke-width="2"/>
      <text y="5" text-anchor="middle" fill="#e0f2fe" font-size="14" font-weight="800">02</text>
      <text y="52" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="800">MODEL</text>
      <text y="72" text-anchor="middle" fill="#64748b" font-size="11">invariants + criteria</text>
    </g>
    <g transform="translate(502,142)">
      <circle r="22" fill="#10213a" stroke="#60a5fa" stroke-width="2"/>
      <text y="5" text-anchor="middle" fill="#dbeafe" font-size="14" font-weight="800">03</text>
      <text y="52" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="800">IMPLEMENT</text>
      <text y="72" text-anchor="middle" fill="#64748b" font-size="11">small inspectable change</text>
    </g>
    <g transform="translate(698,142)">
      <circle r="22" fill="#141d3a" stroke="#60a5fa" stroke-width="2"/>
      <text y="5" text-anchor="middle" fill="#dbeafe" font-size="14" font-weight="800">04</text>
      <text y="52" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="800">VERIFY</text>
      <text y="72" text-anchor="middle" fill="#64748b" font-size="11">tests + differential checks</text>
    </g>
    <g transform="translate(894,142)">
      <circle r="22" fill="#171a37" stroke="#8b5cf6" stroke-width="2"/>
      <text y="5" text-anchor="middle" fill="#ede9fe" font-size="14" font-weight="800">05</text>
      <text y="52" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="800">REVIEW</text>
      <text y="72" text-anchor="middle" fill="#64748b" font-size="11">external challenge</text>
    </g>
    <g transform="translate(1090,142)">
      <circle r="22" fill="#1c1938" stroke="#8b5cf6" stroke-width="2"/>
      <text y="5" text-anchor="middle" fill="#ede9fe" font-size="14" font-weight="800">06</text>
      <text y="52" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="800">EVIDENCE</text>
      <text y="72" text-anchor="middle" fill="#64748b" font-size="11">claim only what survived</text>
    </g>
  </g>
</svg>
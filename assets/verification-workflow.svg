<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Verification-oriented engineering workflow</title>
  <desc id="desc">Six stages from framing to bounded evidence, with validation gates between implementation and external review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d17"/>
      <stop offset="1" stop-color="#111528"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="270" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="268" rx="23" fill="none" stroke="#64748b" stroke-opacity=".22"/>
  <text x="48" y="47" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="1.7">HOW THE WORK IS STRUCTURED</text>
  <text x="48" y="72" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5">The artifact is not the proof. Each stage should leave something another person can inspect.</text>

  <line x1="98" y1="146" x2="1102" y2="146" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
  <line x1="98" y1="146" x2="1102" y2="146" stroke="url(#pipe)" stroke-width="3" stroke-linecap="round"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(106,146)">
      <circle r="28" fill="#082332" stroke="#22d3ee" stroke-width="2"/>
      <text y="5" text-anchor="middle" fill="#cffafe" font-size="13" font-weight="850">01</text>
      <text y="58" text-anchor="middle" fill="#e2e8f0" font-size="13.5" font-weight="800">FRAME</text>
      <text y="78" text-anchor="middle" fill="#64748b" font-size="10.5">problem + limits</text>
    </g>
    <g transform="translate(304,146)">
      <circle r="28" fill="#0a2035" stroke="#38bdf8" stroke-width="2"/>
      <text y="5" text-anchor="middle" fill="#e0f2fe" font-size="13" font-weight="850">02</text>
      <text y="58" text-anchor="middle" fill="#e2e8f0" font-size="13.5" font-weight="800">MODEL</text>
      <text y="78" text-anchor="middle" fill="#64748b" font-size="10.5">invariants + criteria</text>
    </g>
    <g transform="translate(502,146)">
      <circle r="28" fill="#0d1e39" stroke="#3b82f6" stroke-width="2"/>
      <text y="5" text-anchor="middle" fill="#dbeafe" font-size="13" font-weight="850">03</text>
      <text y="58" text-anchor="middle" fill="#e2e8f0" font-size="13.5" font-weight="800">IMPLEMENT</text>
      <text y="78" text-anchor="middle" fill="#64748b" font-size="10.5">small defensible change</text>
    </g>
    <g transform="translate(700,146)">
      <circle r="28" fill="#131b39" stroke="#6366f1" stroke-width="2"/>
      <text y="5" text-anchor="middle" fill="#e0e7ff" font-size="13" font-weight="850">04</text>
      <text y="58" text-anchor="middle" fill="#e2e8f0" font-size="13.5" font-weight="800">VERIFY</text>
      <text y="78" text-anchor="middle" fill="#64748b" font-size="10.5">tests + falsification</text>
    </g>
    <g transform="translate(898,146)">
      <circle r="28" fill="#191936" stroke="#8b5cf6" stroke-width="2"/>
      <text y="5" text-anchor="middle" fill="#ede9fe" font-size="13" font-weight="850">05</text>
      <text y="58" text-anchor="middle" fill="#e2e8f0" font-size="13.5" font-weight="800">REVIEW</text>
      <text y="78" text-anchor="middle" fill="#64748b" font-size="10.5">independent challenge</text>
    </g>
    <g transform="translate(1096,146)">
      <circle r="28" fill="#211936" stroke="#a78bfa" stroke-width="2"/>
      <text y="5" text-anchor="middle" fill="#f3e8ff" font-size="13" font-weight="850">06</text>
      <text y="58" text-anchor="middle" fill="#e2e8f0" font-size="13.5" font-weight="800">EVIDENCE</text>
      <text y="78" text-anchor="middle" fill="#64748b" font-size="10.5">claim what survived</text>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#64748b">
    <text x="376" y="124">SCOPE GATE</text>
    <text x="760" y="124">PROOF GATE</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">David Turner — systems, verification, and AI-assisted engineering</title>
  <desc id="desc">Dark technical banner with a systems graph and focus areas for verification, interoperability, local-first tools, and open source engineering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1728"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#93c5fd" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="378" rx="23" fill="none" stroke="#60a5fa" stroke-opacity="0.20"/>
  <rect x="58" y="50" width="92" height="4" rx="2" fill="url(#accent)"/>

  <text x="58" y="105" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="1.5">DAVID TURNER</text>
  <text x="60" y="143" fill="#93c5fd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">SYSTEMS · VERIFICATION · AI-ASSISTED ENGINEERING</text>

  <text x="60" y="192" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">
    Building inspectable tools and shipping evidence-backed improvements
  </text>
  <text x="60" y="220" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">
    into established open-source codebases.
  </text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">
    <rect x="60" y="260" width="154" height="38" rx="19" fill="#0f2740" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="137" y="284" text-anchor="middle" fill="#bae6fd">VERIFICATION</text>

    <rect x="226" y="260" width="184" height="38" rx="19" fill="#111f3d" stroke="#60a5fa" stroke-opacity="0.5"/>
    <text x="318" y="284" text-anchor="middle" fill="#bfdbfe">INTEROPERABILITY</text>

    <rect x="422" y="260" width="156" height="38" rx="19" fill="#181b3d" stroke="#8b5cf6" stroke-opacity="0.5"/>
    <text x="500" y="284" text-anchor="middle" fill="#ddd6fe">LOCAL-FIRST</text>
  </g>

  <text x="60" y="336" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    evidence &gt; assertion  ·  explicit limits  ·  reproducible checks  ·  human review
  </text>

  <g transform="translate(735,42)">
    <circle cx="220" cy="145" r="112" fill="#0b1f34" stroke="#38bdf8" stroke-opacity="0.18"/>
    <circle cx="220" cy="145" r="76" fill="none" stroke="#60a5fa" stroke-opacity="0.16" stroke-dasharray="4 8"/>
    <circle cx="220" cy="145" r="40" fill="#0d2238" stroke="#7dd3fc" stroke-opacity="0.65"/>
    <text x="220" y="141" text-anchor="middle" fill="#e0f2fe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">INSPECTABLE</text>
    <text x="220" y="161" text-anchor="middle" fill="#93c5fd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">SYSTEMS</text>

    <g stroke-width="2" fill="none">
      <path d="M220 105 L122 62 L76 135" stroke="#38bdf8" stroke-opacity="0.52"/>
      <path d="M260 145 L350 84 L380 160" stroke="#60a5fa" stroke-opacity="0.52"/>
      <path d="M220 185 L140 250 L62 226" stroke="#8b5cf6" stroke-opacity="0.52"/>
      <path d="M260 178 L336 238 L398 214" stroke="#38bdf8" stroke-opacity="0.52"/>
      <path d="M122 62 L350 84" stroke="#334155" stroke-opacity="0.7" stroke-dasharray="4 6"/>
      <path d="M76 135 L62 226" stroke="#334155" stroke-opacity="0.7" stroke-dasharray="4 6"/>
      <path d="M380 160 L398 214" stroke="#334155" stroke-opacity="0.7" stroke-dasharray="4 6"/>
    </g>

    <g filter="url(#glow)">
      <circle cx="122" cy="62" r="7" fill="#38bdf8"/>
      <circle cx="76" cy="135" r="6" fill="#60a5fa"/>
      <circle cx="62" cy="226" r="6" fill="#8b5cf6"/>
      <circle cx="140" cy="250" r="7" fill="#60a5fa"/>
      <circle cx="350" cy="84" r="7" fill="#8b5cf6"/>
      <circle cx="380" cy="160" r="6" fill="#38bdf8"/>
      <circle cx="398" cy="214" r="7" fill="#60a5fa"/>
      <circle cx="336" cy="238" r="6" fill="#8b5cf6"/>
    </g>

    <g fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
      <text x="100" y="45">PROVENANCE</text>
      <text x="18" y="128">TESTS</text>
      <text x="6" y="250">LIMITS</text>
      <text x="322" y="65">REVIEW</text>
      <text x="386" y="151">TRACE</text>
      <text x="360" y="244">EVIDENCE</text>
    </g>
  </g>
</svg>
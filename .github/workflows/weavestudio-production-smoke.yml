name: WeaveStudio Production Smoke

on:
  push:
    branches:
      - qa/weavestudio-production-smoke-20260819

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Run canonical production provenance smoke
        env:
          BASE_URL: https://weavestudio-nine.vercel.app
        run: |
          cat > /tmp/weavestudio-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';

          const base = process.env.BASE_URL;
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          const errors = [];
          page.on('console', (message) => {
            if (message.type() === 'error') errors.push(`console:${message.text()}`);
          });
          page.on('pageerror', (error) => errors.push(`pageerror:${error.message}`));

          const visible = async (locator, label) => {
            await locator.waitFor({ state: 'visible', timeout: 20000 });
            console.log(`PASS ${label}`);
          };

          try {
            await page.goto(`${base}/`, { waitUntil: 'networkidle', timeout: 30000 });
            if (!page.url().startsWith(base)) throw new Error(`Unexpected URL: ${page.url()}`);
            if (!(await page.title()).includes('WeaveStudio')) throw new Error(`Unexpected title: ${await page.title()}`);
            await visible(page.getByRole('button', { name: 'Open guided demo' }), 'canonical landing renders');
            await visible(page.getByRole('button', { name: 'Start with a template' }), 'primary landing controls render');

            await page.getByTestId('open-guided-demo').click();
            await visible(page.getByRole('heading', { name: 'Source material' }), 'guided demo workspace opens');
            await page.getByTestId('workflow-canvas').waitFor({ state: 'attached', timeout: 20000 });
            console.log('PASS workflow canvas attached');

            const source = page.getByLabel('Source material');
            await source.evaluate((element) => {
              element.focus();
              element.setSelectionRange(0, Math.min(32, element.value.length));
              element.dispatchEvent(new Event('select', { bubbles: true }));
            });
            const addFragment = page.getByRole('button', { name: 'Add source fragment' });
            if (!(await addFragment.isEnabled())) throw new Error('Add source fragment did not enable after selection');
            await addFragment.click();
            await visible(page.getByRole('status').filter({ hasText: /source fragment added for provenance/i }), 'source fragment authoring');

            await page.getByRole('button', { name: /workflow outline/i }).click();
            let outline = page.getByRole('region', { name: /workflow outline/i });
            await outline.getByRole('button', { name: /proposed approach/i }).click();
            await page.getByLabel('Content').fill('A traceable pilot recommendation based on the selected source evidence.');

            await page.getByRole('button', { name: /workflow outline/i }).click();
            outline = page.getByRole('region', { name: /workflow outline/i });
            await outline.getByRole('button', { name: /assumption check/i }).click();
            await page.getByRole('button', { name: 'Approve', exact: true }).click();
            console.log('PASS human review approval applied');

            await page.getByRole('button', { name: 'Validate' }).click();
            const validator = page.getByRole('dialog', { name: 'Workflow Validator' });
            await visible(validator.getByText('Ready', { exact: true }).first(), 'workflow validator reports Ready');
            await page.getByRole('button', { name: 'Close Workflow Validator' }).click();

            await page.getByRole('button', { name: 'Generate' }).click();
            const preview = page.getByRole('dialog', { name: 'Output preview' });
            await visible(preview, 'output preview opens');
            await preview.getByRole('button', { name: 'Provenance' }).click();
            await visible(preview.getByText('Workspace lineage only — this does not verify the truth or authenticity of the source.'), 'trust-boundary disclosure');
            await visible(preview.getByRole('heading', { name: 'Annotate a claim' }), 'claim annotation surface');

            const candidate = preview.getByLabel('Claim candidate');
            await candidate.selectOption({ index: 1 });
            await preview.getByRole('checkbox', { name: /source fragment/i }).first().check();
            await preview.getByLabel('Derivation').selectOption('direct');
            await preview.getByRole('button', { name: 'Save provenance' }).click();
            await visible(preview.getByText('Valid', { exact: true }).first(), 'saved provenance resolves Valid');
            await visible(preview.getByText(/source range/i).first(), 'source range is inspectable');

            const storage = await page.evaluate(() => Object.entries(localStorage).map(([k, v]) => `${k}:${v}`).join('\n'));
            if (!/provenance|sourceFragments|claim/i.test(storage)) throw new Error('No provenance-bearing browser-local state found after save');
            console.log('PASS provenance persisted to browser-local workspace state');

            await page.screenshot({ path: 'weavestudio-production-provenance.png', fullPage: true });

            if (errors.length) throw new Error(`Browser console/page errors: ${JSON.stringify(errors)}`);
            console.log('PASS browser console/page error check');
            console.log('PRODUCTION_SMOKE_PASS');
          } finally {
            await browser.close();
          }
          EOF
          node /tmp/weavestudio-smoke.mjs

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weavestudio-production-smoke-evidence
          path: weavestudio-production-provenance.png
          if-no-files-found: ignore

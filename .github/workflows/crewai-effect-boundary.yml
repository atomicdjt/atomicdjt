name: CrewAI effect-boundary integration
on:
  push:
    branches: ["test/crewai-effect-boundary"]
    paths:
      - "research/crewai_effect_boundary/**"
      - ".github/workflows/crewai-effect-boundary.yml"
  pull_request:
    paths:
      - "research/crewai_effect_boundary/**"
      - ".github/workflows/crewai-effect-boundary.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crewai-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CrewAI runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "crewai @ git+https://github.com/crewAIInc/crewAI.git@911270929444ffc385e725e15976821ea503ddc2#subdirectory=lib/crewai"
          python -c 'import crewai; from importlib.metadata import version; assert version("crewai") == "1.15.28"; print("CrewAI runtime imported:", crewai.__file__, "version:", version("crewai"), "source commit: 911270929444ffc385e725e15976821ea503ddc2")'
      - name: Run localhost HTTP and actual CrewAI dispatch tests
        run: python -m unittest discover -s research/crewai_effect_boundary -p 'test_*.py' -v

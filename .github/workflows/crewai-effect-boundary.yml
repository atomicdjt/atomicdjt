name: CrewAI effect-boundary integration
on:
  push:
    branches: ["test/crewai-effect-boundary"]
    paths:
      - "research/crewai_effect_boundary/**"
      - ".github/workflows/crewai-effect-boundary.yml"
  pull_request:
    paths:
      - "research/crewai_effect_boundary/**"
      - ".github/workflows/crewai-effect-boundary.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crewai-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CrewAI runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "crewai==1.15.28"
          python -c 'import crewai; print("CrewAI runtime imported:", crewai.__file__)'
      - name: Run localhost HTTP and actual CrewAI dispatch tests
        run: python -m unittest discover -s research/crewai_effect_boundary -p 'test_*.py' -v
